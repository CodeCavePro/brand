# Verify the repository, and deploy docs/ to Pages from development.
#
# TWO BEHAVIOURS, ONE FILE. On development it does what it always did: verify,
# rebuild the storybook when it can, build, publish. On chore/* it does every
# one of those things EXCEPT publish — the deploy job carries the ref check.
# Branches were unverified until 2026-08-26, so a pull request showed no checks
# and the first run against a change happened after it had already merged.
#
# The guard is on the DEPLOY job rather than on the trigger, deliberately: a
# branch that cannot build is a branch worth failing, and gating the trigger
# instead would have told us nothing until merge. It also catches
# workflow_dispatch from a branch, which used to publish that branch.
#
# The storybook's compiled/*.js and tw-bridge.css are generated from
# src/components/ and src/captured/ using this repository's own toolchain. That
# is recent: it used to need a codecave.pro checkout, which meant the rebuild
# ran only where a second private repo was reachable -- and it was not, so it
# never ran at all. See the step for why that dependency is gone.
#
# So the job is in two parts, and the order matters:
#
#   1. A verification that ALWAYS runs. check-tw-bridge.mjs needs nothing but
#      node, and it proves the committed storybook is in step with the sources
#      beside it. This is the real guarantee — a stale bridge compiles and
#      loads and silently documents an older site, so nothing else catches it.
#
#   1b. A typecheck of storybook/ports/ against the interfaces in ports.d.ts.
#      Needs typescript, so it follows step 1 rather than joining it — step 1
#      keeps its "nothing but node" property.
#
#   1c. The package built and checked against src/. Needs the install, and
#      must precede the rebuild below, which compiles each specimen from
#      packages/brand/dist/ and refuses to run without it. Together 1, 1b and
#      1c are exactly what `npm run check` runs -- all eight assertions.
#
#   2. The storybook rebuilt, then the site built over it. Both unconditional
#      now. The rebuild writes into docs/storybook/, so building before it would
#      publish the previous run's output.
#
# If the rebuild produces something different from what is committed, the FRESH
# output is what deploys — it is strictly the more correct artifact — and the
# difference is reported in the job summary rather than failing the run.
#
# Rebuild prerequisites: CodeCavePro/codecave.pro must be readable. If it is
# private, add a repo-scoped PAT as the CODECAVE_PRO_TOKEN secret; the default
# GITHUB_TOKEN cannot read another repository.
name: Verify, and deploy Pages from development

on:
  # development is the branch that DEPLOYS. chore/* runs everything except the
  # deploy — see the `if` on that job — so a branch gets the full nine checks
  # and a real build before anyone merges it. Nothing here ran on a branch
  # before, which meant a pull request showed no checks at all and the first
  # time a change was verified was after it was already on the default branch.
  push:
    branches: ["development", "chore/*"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Keyed on the ref, so a branch run can never queue behind or delay a
# production deploy. Every development run still shares one group and is never
# cancelled — that is the original property: one concurrent deployment, allowed
# to finish. Branch runs get a group each and DO cancel, because a superseded
# check of a branch is worth nothing.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Runs unconditionally and depends on nothing. If this fails, the
      # committed storybook does not match the component sources, so whatever
      # we publish would be documenting an earlier state of them.
      - name: Verify the storybook matches its sources
        run: node tools/check-tw-bridge.mjs

      # Same category, and the same reason it is not folded into the step
      # above: both its inputs are committed, so it needs no site checkout and
      # no install. An import map that has stopped resolving what the bundles
      # import takes every specimen on the page down without an error anyone
      # sees — the page still renders, it is just empty where the component
      # was.
      - name: Check the storybook import map
        run: node tools/check-importmap.mjs

      # Third of the dependency-free three, and the one that guards prose
      # rather than code. Three files quote how many findings the story pages
      # carry; all three are hand-typed, and the split has already drifted
      # without the total moving — a note marked fixed upstream lost its
      # is-warn, turning a defect into an observation while 55 stayed 55. That
      # is invisible to a reader and to every other check here.
      - name: Check the findings counts against the story pages
        run: node tools/check-findings.mjs

      # The six files under docs/examples/raw/ are the only things here that are
      # not pages: standalone documents a client is handed, which Astro never
      # renders and nothing else looks at. Moving them one directory deeper broke
      # the wordmark and the Satoshi @font-face rules in four of the six, and every
      # check in the repo stayed green -- including the wrapper pages that embed
      # them, because an <iframe> reports nothing about what happens inside it.
      - name: Check the deliverables’ references still resolve
        run: node tools/check-examples.mjs

      # Collapsing five documentation surfaces into two moved most of this
      # site’s URLs, and the dozens of places that CITE them are prose. A
      # markdown link to a page that no longer exists fails nowhere — not the
      # build, not any other check — except for a reader. The route set is
      # derived from committed source rather than dist/, so this needs no build.
      - name: Check every cited documentation route exists
        run: node tools/check-links.mjs

      # The ports typecheck needs typescript, so it cannot go in the
      # dependency-free check above — it goes after it. An adapter that has
      # drifted from the interface its component imports compiles perfectly and
      # fails as an undefined in a reader's browser, which is the one place a
      # specimen must not fail. That is the whole reason ports are typechecked
      # rather than left as stubs, and leaving the check off CI would give the
      # rot back.
      - name: Install the brand toolchain
        run: npm ci

      - name: Typecheck the storybook ports
        run: npm run check:ports

      # Both inputs are in this checkout — the component sources are committed, and
      # Tailwind's default theme comes from a devDependency pinned to the
      # version the site resolves — so this needs no site checkout and belongs
      # in CI. It catches a token that would silently redefine a Tailwind
      # default in every consumer's app, which nothing about the docs build or
      # the package build would ever notice.
      - name: Check the token layer against Tailwind
        run: npm run check:collisions

      # The package is a pure derivative of src/, and this asserts it: every
      # copied file byte-identical to its origin, theme.css agreeing with the
      # tokens, the README's quoted values matching the compiled module. It was
      # only ever run by release.yml, which means a change that broke the
      # package stayed green here and surfaced at publish time.
      #
      # It also has to happen BEFORE the rebuild below, which is the bug this
      # step fixes rather than merely covers: build-storybook.mjs compiles each
      # specimen from packages/brand/dist/ and refuses to run without it. CI
      # never built the package, so the rebuild step would have failed with
      # "The package is not built" -- invisibly, because it only runs when
      # CODECAVE_PRO_TOKEN can reach codecave.pro, which it currently cannot.
      - name: Build the package
        run: npm run build:package

      - name: Check the package against its origin
        run: npm run check --workspace @codecavepro/brand

      # ---- rebuild the storybook -------------------------------------------
      # This used to be an OPTIONAL half: check out CodeCavePro/codecave.pro for
      # its node_modules, install it with pnpm, and skip the rebuild without
      # failing when the repo was unreachable -- because build-storybook.mjs
      # resolved vue/compiler-sfc, esbuild and tailwindcss from there, on the
      # argument that a specimen must be built with the versions the WEBSITE
      # builds with.
      #
      # That argument died with the inversion. The components are authored in
      # this repository, the package is built here, and the site installs it --
      # so those are a consumer's versions, not the origin's. Everything the
      # generator needs is declared here and pinned to match, and switching it
      # over produced BYTE-IDENTICAL output: all twelve bundles and
      # tw-bridge.css unchanged.
      #
      # Worth knowing what this removes, because it was never visible: the
      # checkout had been returning 403 for want of a working
      # CODECAVE_PRO_TOKEN, so the rebuild step had never run here even once.
      # Roughly seventy lines of skip-diagnosis prose went with it, along with
      # the pnpm install and the secret. That secret is now unused by this
      # repository and can be deleted.
      - name: Rebuild the storybook
        run: npm run build:storybook

      # The generator pins esbuild's absWorkingDir, so unchanged sources
      # reproduce byte-identical output regardless of where it ran. Anything
      # reported here is a real difference between the committed storybook and a
      # fresh build -- which now means a stale commit rather than a toolchain
      # that moved underneath it.
      - name: Report any rebuild drift
        run: |
          if git diff --quiet -- docs/storybook; then
            echo "Rebuilt storybook is identical to the committed output." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Storybook rebuild differs from the committed output"
              echo ""
              echo "The freshly built files are what this run publishes. Regenerate and commit to clear this:"
              echo ""
              echo '```'
              echo "npm run build:storybook"
              echo '```'
              echo ""
              echo '```diff'
              git diff --stat -- docs/storybook
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ---- build the site --------------------------------------------------
      # LAST, deliberately. The storybook rebuild above writes into
      # docs/storybook/, so building before it would publish the previous run's
      # output. Everything this step needs is in this checkout — see
      # astro.config.mjs — so an unreachable codecave.pro cannot reach it, and
      # the safety property in this file's header survives the migration: a
      # neighbouring repo going private must never take this site down.
      #
      # The build fails if dist/ is not a superset of docs/. That matters more
      # than usual while the migration is half-done, because most pages reach
      # the site by being COPIED and only a few by being rendered — so a
      # passthrough that silently stopped would deploy a site missing almost
      # every page, with a green tick. See tools/astro-passthrough.mjs.
      - name: Build the docs site
        run: npm run build

      # ---- publish ---------------------------------------------------------
      # Guarded on the same ref as the deploy job. A branch run has just proved
      # the thing worth proving — every check passes and the site builds — and
      # a Pages-shaped tarball no branch can deploy is not worth uploading on
      # every push. Note this is the LAST thing skipped: `npm run build` above
      # runs everywhere, so a branch that cannot build still fails.
      - name: Setup Pages
        if: github.ref == 'refs/heads/development'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: github.ref == 'refs/heads/development'
        uses: actions/upload-pages-artifact@v3
        with:
          # dist/, not docs/ — CCWEB2-317. docs/ is now sources plus payload
          # and can no longer be served as-is: a ported page exists there only
          # as .astro. dist/ is docs/ passed through with the pages rendered
          # over the top.
          path: './dist'

  deploy:
    needs: build
    # ONLY development publishes. Without this line adding chore/* above would
    # put whatever is on a work-in-progress branch onto brand.codecave.pro, and
    # the last branch pushed would be the live site until someone pushed
    # development again. The build job above still runs in full on a branch —
    # what is skipped is the publish, not the verification.
    if: github.ref == 'refs/heads/development'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
